<span class="luz" role="img"
      [class.marco]="marco()"
      [class.encendida]="encendida()"
      [style.color]="color()"
      [style.--tam]="tamano() + 'px'"
      [attr.aria-label]="nombre()">
  @switch (tipo()) {
    @case ('motor') {
      <svg viewBox="0 0 24 24" [attr.width]="tamano()" [attr.height]="tamano()" aria-hidden="true">
        <path d="M5 10h3V8.5h2V7h5v1.5h2V10h2l1.5 1.5V13H22v-2.5h1v7h-1V15h-1.5v1.5L19 18H9l-2.5-2.5H4V17H3v-7h1v1.5h1z"
              fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
    }
    @case ('posicion') {
      <svg viewBox="0 0 24 24" [attr.width]="tamano()" [attr.height]="tamano()" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <path d="M8 8a4 4 0 0 1 0 8"/><path d="M16 8a4 4 0 0 0 0 8"/>
          <path d="M2 9l3 1"/><path d="M2 12h3"/><path d="M2 15l3-1"/>
          <path d="M22 9l-3 1"/><path d="M22 12h-3"/><path d="M22 15l-3-1"/>
        </g>
      </svg>
    }
    @case ('luces') {
      <svg viewBox="0 0 24 24" [attr.width]="tamano()" [attr.height]="tamano()" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M13 5c4.5 0 7.5 3 7.5 7s-3 7-7.5 7h-1.5V5z"/>
          <path d="M2.5 7h6.5"/><path d="M2.5 10.3h6.5"/><path d="M2.5 13.7h6.5"/><path d="M2.5 17h6.5"/>
        </g>
      </svg>
    }
    @case ('bujia') {
      <svg viewBox="0 0 24 24" [attr.width]="tamano()" [attr.height]="tamano()" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <path d="M3 14c0-3 2-3 2-6M3 14h18M7 14c0-3 2-3 2-6s2-3 2 0 2 3 2 0 2-3 2 0 2 3 2 0"/>
          <path d="M5 17h14"/>
        </g>
      </svg>
    }
    @case ('nafta') {
      <svg viewBox="0 0 24 24" [attr.width]="tamano()" [attr.height]="tamano()" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
          <rect x="4" y="5" width="9" height="15" rx="1.2"/>
          <path d="M13 9h2.5l2 2v6.5a1.5 1.5 0 0 0 3 0V9l-2-2.5"/>
          <path d="M2.5 20h12"/>
        </g>
        <rect x="6" y="7.5" width="5" height="4" fill="currentColor"/>
      </svg>
    }
    @case ('mano') {
      <svg viewBox="0 0 24 24" [attr.width]="tamano()" [attr.height]="tamano()" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="12" cy="12" r="6"/>
          <path d="M5 6.5a8 8 0 0 0 0 11M19 6.5a8 8 0 0 1 0 11"/>
          <path d="M12 9v3.5"/>
        </g>
        <circle cx="12" cy="15" r="0.9" fill="currentColor"/>
      </svg>
    }
    @case ('llave') {
      <svg viewBox="0 0 24 24" [attr.width]="tamano()" [attr.height]="tamano()" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 15l1.5-4.5h9L15 15v3H3z"/>
          <circle cx="18" cy="7" r="3"/>
          <path d="M16 9l-3.5 3.5M14 11l1 1"/>
        </g>
      </svg>
    }
    @case ('cinturon') {
      <svg viewBox="0 0 24 24" [attr.width]="tamano()" [attr.height]="tamano()" aria-hidden="true">
        <circle cx="12" cy="5" r="2" fill="currentColor"/>
        <g fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M8 21v-9a4 4 0 0 1 8 0v9"/>
          <path d="M8 9l8 8"/>
        </g>
      </svg>
    }
  }
</span>

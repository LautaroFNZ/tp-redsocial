<section class="pedalera" aria-label="Pedalera">
  <span class="titulo">Pedalera</span>

  <button type="button" class="pedal" (click)="embrague.emit()"
          [attr.aria-label]="'Embrague: cambiar el orden. Marcha actual ' + marcha()">
    <span class="marcha">{{ marcha() }}</span>
    <svg width="46" height="62" viewBox="0 0 46 62" aria-hidden="true">
      <rect x="18" y="0" width="10" height="20" fill="#5A5D64"/>
      <rect x="3" y="16" width="40" height="44" rx="8" fill="#2A2C31" stroke="#F28C28" stroke-width="4"/>
      <g stroke="#8A8D94" stroke-width="3"><path d="M11 28H35"/><path d="M11 37H35"/><path d="M11 46H35"/></g>
    </svg>
    <b>Embrague</b><small>cambiar orden</small>
  </button>

  <button type="button" class="pedal" (click)="freno.emit()" [disabled]="!hayAnterior()"
          aria-label="Freno: publicación anterior">
    <svg width="54" height="62" viewBox="0 0 54 62" aria-hidden="true">
      <rect x="22" y="0" width="10" height="18" fill="#5A5D64"/>
      <rect x="3" y="14" width="48" height="46" rx="8" fill="#2A2C31" stroke="#E0413B" stroke-width="4"/>
      <path d="M27 22 L18 36 H24 V50 H30 V36 H36 Z" fill="#E0413B"/>
    </svg>
    <b>Freno</b><small>anterior</small>
  </button>

  <button type="button" class="pedal" (click)="acelerador.emit()" [disabled]="!haySiguiente()"
          aria-label="Acelerador: publicación siguiente">
    <svg width="40" height="78" viewBox="0 0 40 78" aria-hidden="true">
      <rect x="3" y="3" width="34" height="72" rx="7" fill="#2A2C31" stroke="#2FB35A" stroke-width="4"/>
      <path d="M20 62 L11 48 H17 V30 H23 V48 H29 Z" fill="#2FB35A"/>
    </svg>
    <b>Acelerador</b><small>siguiente</small>
  </button>
</section>

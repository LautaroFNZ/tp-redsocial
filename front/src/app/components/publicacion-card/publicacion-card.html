@let p = publicacion();
<article class="publicacion">
  <app-foto-auto class="foto" [imagen]="p.imagen" [alt]="p.titulo" />

  <span class="km" [attr.aria-label]="'Publicación número ' + posicion()">KM {{ km() }}</span>

  <div class="acciones">
    <button class="accion" type="button" [class.prendida]="leGusta()" [disabled]="procesando()"
            (click)="luces.emit()" [attr.aria-pressed]="leGusta()"
            [attr.aria-label]="leGusta() ? 'Apagar las luces (quitar me gusta)' : 'Hacerle luces (me gusta)'">
      <app-luz-testigo tipo="luces" [encendida]="leGusta()" [marco]="false" [tamano]="28" />
    </button>
    <span>{{ p.cantidadMeGusta }}</span>

    <button class="accion clara" type="button" disabled aria-label="Comentarios (próximamente)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.4"
           stroke-linejoin="round" aria-hidden="true">
        <path d="M4 5h16v11H9l-5 4z"/>
      </svg>
    </button>
  </div>
</article>

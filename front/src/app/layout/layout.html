<div class="layout">
  <aside class="lateral">
      <div class="cabecera">
      <a class="logo" routerLink="/publicaciones" aria-label="GarageHub, ir a la ruta">
        <app-patente texto="GarageHub" leyenda="RED SOCIAL FIERRERA" />
      </a>

      <nav class="menu" aria-label="Navegación principal">
        <a class="btn amarillo" routerLink="/publicaciones" routerLinkActive="activo">Ruta</a>
        <a class="btn naranja" routerLink="/mi-perfil" routerLinkActive="activo">Mi garage</a>
        <a class="btn" routerLink="/login">Salir</a>
      </nav>
    </div>

    @if (panel.contenido(); as tarjeta) {
      <div class="panel">
        <ng-container [ngTemplateOutlet]="tarjeta" />
      </div>
    }
  </aside>

  <main class="contenido">
    <router-outlet />
  </main>
</div>
